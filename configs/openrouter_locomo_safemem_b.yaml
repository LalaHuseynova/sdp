# OpenRouter transport for configs/v31_locomo_withhold_b.yaml.
# Original SAFE-Mem settings and prompt versions are preserved.
# All configured chat roles use the same GPT-4o-mini model through OpenRouter.
dataset:
  path: data/locomo/locomo10.json
models:
  memory: openrouter:openai/gpt-4o-mini
  agent: openrouter:openai/gpt-4o-mini
  judge: openrouter:openai/gpt-4o-mini
  embed: 'local:'
prompts:
  extract_typed_claims: v1
  extract_dialogue_claims: v1
  classify_use_type: v2
  detect_conflict: v1
  retention_sentence: v1
memory_system: typed
memory:
  max_facts: 20
typed:
  mode: withhold
  hops: 0
  detect_conflicts: true
  endorsement: sentence
  evidence_slots: 4
  external_evidence: false
locomo:
  principal: speaker_b
systems:
- memory
retrieve_k: 4
seed: 0
runtime:
  workers: 8
name: openrouter_locomo_safemem_b
